name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-integrity:
    name: Policy integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q stream_attention benchmarks tests
      - name: Validate policy registry and fail-closed routing metadata
        run: python benchmarks/check_seed_only_policy_route_smoke.py --allow-no-torch

  unit-tests:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install pytest numpy pyyaml
          python -m pip install --no-deps -e .
      - name: Run CPU test suite
        run: python -m pytest -q

  gpu-source-contract:
    name: GPU source contract (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install GPU source-contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install triton==3.1.0 pytest numpy pyyaml
          python -m pip install --no-deps -e .
      - name: Validate shipped Triton and SM90 source
        run: |
          python benchmarks/check_gpu_source_contract.py
          python -m pytest -q \
            tests/test_gate0_projection_bitmask_triton.py \
            tests/test_gate0_projection_mask_triton.py \
            tests/test_gate0_projection_scan_triton.py \
            tests/test_gate0_summary_scan_triton.py \
            tests/test_qwen_o_proj_triton.py \
            tests/test_seed_only_split_seed.py \
            tests/test_sm90_exact_backend.py

  package:
    name: Source and wheel package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
      - name: Validate package metadata and wheel contents
        run: |
          python -m twine check dist/*
          python benchmarks/check_wheel_contents.py dist/*.whl
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stream-attention-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required checks
    if: always()
    needs: [policy-integrity, unit-tests, gpu-source-contract, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required job results
        env:
          POLICY_RESULT: ${{ needs.policy-integrity.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          GPU_SOURCE_RESULT: ${{ needs.gpu-source-contract.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$GPU_SOURCE_RESULT" = success
          test "$PACKAGE_RESULT" = success
